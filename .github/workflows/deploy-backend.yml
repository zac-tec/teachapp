name: Deploy Cloudflare backend
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/lib/curriculum.ts"
      - "migrations/**"
      - "scripts/deploy-config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teachapp-production-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_BACKEND == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/deploy-config.mjs
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
      - name: Publish API
        run: npx wrangler deploy --config wrangler.deploy.json
