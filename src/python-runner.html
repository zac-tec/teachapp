<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net/pyodide/v0.27.7/full/; connect-src https://cdn.jsdelivr.net/pyodide/v0.27.7/full/; worker-src blob:; child-src blob:;">
<script id="worker-code" type="text/plain">
(async () => {
 importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');
 const py = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});
 self.postMessage({type:'ready'});
 self.onmessage = async ({data}) => {
  let output='',total=0,truncated=false;
  const flush=()=>{if(output){self.postMessage({type:'output',text:output});output=''}};
  const decoder=new TextDecoder();
  const write=(bytes)=>{const text=decoder.decode(bytes,{stream:true});const room=20000-total;if(room>0){const part=text.slice(0,room);output+=part;total+=part.length;if(output.length>=512)flush()}if(text.length>room&&!truncated){flush();self.postMessage({type:'output',text:'\n[Output limit reached]\n'});truncated=true}return bytes.length};
  py.setStdout({write});py.setStderr({write});
  const lines=data.input===''?[]:data.input.replace(/\r\n/g,'\n').split('\n');let position=0;
  py.setStdin({stdin:()=>position<lines.length?lines[position++]:null});
  try {await py.runPythonAsync(data.code);flush();self.postMessage({type:'done'})}
  catch(error){flush();self.postMessage({type:'error',text:String(error).slice(-12000)})}
 };
})().catch(error=>self.postMessage({type:'error',text:'Python could not load. Check your connection and try again. '+String(error).slice(0,300)}));
</script>
<script>
let worker=null,runId=null,pending=null;
const send=(data)=>parent.postMessage({...data,runId},'*');
addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='run')return;
 worker?.terminate();runId=event.data.runId;pending={code:event.data.code,input:event.data.input};
 const url=URL.createObjectURL(new Blob([document.getElementById('worker-code').textContent],{type:'text/javascript'}));
 try {
 worker=new Worker(url);
 worker.onmessage=({data})=>{if(data.type==='ready'){URL.revokeObjectURL(url);send({type:'running'});worker.postMessage(pending)}else send(data)};
 worker.onerror=(e)=>send({type:'error',text:'Python could not start: '+e.message});
 }catch(error){send({type:'error',text:'This browser could not start Python.'})}
});
parent.postMessage({type:'frame-ready'},'*');
</script>
